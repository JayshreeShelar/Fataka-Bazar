<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fataka Bazaar</title>
<meta name="description" content="Fataka Bazaar Wholesale Depot - Pimpri Chinchwad, Pune. Fixed rate crackers, order on WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
<div id="site-header"></div>
<main>
<section class="slider" id="hero">
  <canvas class="fw-canvas"></canvas>
  <div class="slide s1 active"><div class="container slide-in">
    <div class="slide-txt"><span class="eyebrow" data-i18n="s1_eb"></span><h1 data-i18n="s1_t"></h1><p data-i18n="s1_p"></p>
    <div class="btn-row"><a class="btn btn-gold" href="products.html" data-i18n="shop_now"></a><a class="btn btn-outline" href="contact.html" data-i18n="nav_contact"></a></div></div>
    <div class="slide-art"></div></div></div>
  <div class="slide s2"><div class="container slide-in">
    <div class="slide-txt"><span class="eyebrow" data-i18n="s2_eb"></span><h1 data-i18n="s2_t"></h1><p data-i18n="s2_p"></p>
    <div class="btn-row"><a class="btn btn-gold" href="products.html" data-i18n="shop_now"></a><a class="btn btn-outline" href="contact.html" data-i18n="nav_contact"></a></div></div>
    <div class="slide-art"></div></div></div>
  <div class="slide s3"><div class="container slide-in">
    <div class="slide-txt"><span class="eyebrow" data-i18n="s3_eb"></span><h1 data-i18n="s3_t"></h1><p data-i18n="s3_p"></p>
    <div class="btn-row"><a class="btn btn-gold" href="products.html" data-i18n="shop_now"></a><a class="btn btn-outline" href="contact.html" data-i18n="nav_contact"></a></div></div>
    <div class="slide-art"></div></div></div>
  <button class="arrow prev" type="button" aria-label="previous">‹</button><button class="arrow next" type="button" aria-label="next">›</button>
  <div class="dots" id="dots"></div>
</section>
<span id="start"></span>
<section class="section "><div class="container">
<div class="sec-title reveal"><h2 data-i18n="cat_t"></h2><p data-i18n="cat_p"></p></div><div class="cat-grid" id="catGrid"></div>
</div></section>
<section class="section alt"><div class="container">
<div class="feat-row" id="featRow"></div>
</div></section>
<section class="section "><div class="container">
<div class="sec-title reveal"><h2 data-i18n="feat_t"></h2><p data-i18n="feat_p"></p></div><div class="p-grid" id="featGrid"></div><div style="text-align:center;margin-top:34px"><a class="btn btn-outline" href="products.html" data-i18n="view_all"></a></div>
</div></section>
<section class="section alt"><div class="container">
<div class="sec-title reveal"><h2 data-i18n="steps_t"></h2><p data-i18n="steps_p"></p></div><div class="steps-grid"></div>
</div></section>
<section class="section "><div class="container">
<div class="sec-title reveal"><h2 data-i18n="disc_t"></h2><p data-i18n="disc_p"></p></div><div class="tiers" id="tiers"></div>
</div></section>
<section class="section"><div class="container"><div class="wish reveal"><span class="diya"></span><span class="diya"></span><span class="diya"></span><h2 data-i18n="wish_t"></h2><p data-i18n="wish_p"></p><a class="btn btn-gold" href="products.html" data-i18n="shop_now"></a></div></div></section>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
